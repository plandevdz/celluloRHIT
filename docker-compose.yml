# Celluloplast | Parcours salarié — déploiement sur le serveur Debian.
# Copier .env.example en .env (droits 600), renseigner les valeurs, puis :
#   docker compose up -d --build
# Seul le proxy publie des ports (80 → redirection, 443 HTTPS).

name: celluloplast

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cellulo
      POSTGRES_USER: cellulo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      TZ: Africa/Algiers
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellulo -d cellulo"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build: .
    image: celluloplast-parcours:latest
    command: ["celluloplast", "serve"]
    restart: unless-stopped
    environment: &app_env
      DATABASE_URL: postgres://cellulo@db:5432/cellulo
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL:?définir PUBLIC_URL dans .env}
      COOKIE_SECURE: "true"
      # Avis : « journal » (aucun envoi) tant qu'Exchange n'est pas raccordé.
      MAIL_MODE: ${MAIL_MODE:-journal}
      MAIL_TEST_RECIPIENT: ${MAIL_TEST_RECIPIENT:-}
      MAIL_ALLOWED_DOMAINS: ${MAIL_ALLOWED_DOMAINS:-}
      MAIL_SENDER: ${MAIL_SENDER:-}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CERT_FILE: /run/celluloplast/graph-envoi.crt
      GRAPH_KEY_FILE: /run/celluloplast/graph-envoi.key
      # Archivage SharePoint : identité distincte de celle d'envoi.
      ARCHIVE_MODE: ${ARCHIVE_MODE:-desactive}
      ARCHIVE_TENANT_ID: ${ARCHIVE_TENANT_ID:-}
      ARCHIVE_CLIENT_ID: ${ARCHIVE_CLIENT_ID:-}
      ARCHIVE_CERT_FILE: /run/celluloplast/graph-archive.crt
      ARCHIVE_KEY_FILE: /run/celluloplast/graph-archive.key
      ARCHIVE_SITE_ID: ${ARCHIVE_SITE_ID:-}
      ARCHIVE_DRIVE_ID: ${ARCHIVE_DRIVE_ID:-}
      ARCHIVE_ROOT: ${ARCHIVE_ROOT:-Celluloplast}
      ALERT_DAYS: ${ALERT_DAYS:-30}
      ALERT_KM: ${ALERT_KM:-1000}
      ESCALATION_MINUTES: ${ESCALATION_MINUTES:-60}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-10}
      # Pilote : modules facultatifs fermés (menus masqués, routes refusées,
      # traitements arrêtés). Non défini = « pilote » ; vide = tout ouvert.
      MODULES_DESACTIVES: ${MODULES_DESACTIVES-pilote}
      RUST_LOG: ${RUST_LOG:-info,sqlx=warn}
    volumes:
      - documents:/var/lib/celluloplast
      # Certificats et clés Microsoft Graph (hors dépôt, chmod 600, uid 10001).
      - ./secrets:/run/celluloplast:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  worker:
    image: celluloplast-parcours:latest
    pull_policy: never # image construite par le service app
    command: ["celluloplast", "worker"]
    restart: unless-stopped
    environment: *app_env
    volumes:
      - documents:/var/lib/celluloplast
      # Certificats et clés Microsoft Graph (hors dépôt, chmod 600, uid 10001).
      - ./secrets:/run/celluloplast:ro
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks: [internal]

  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS:?définir SERVER_ADDRESS dans .env}
      # Adresse IP présentée aux navigateurs qui n'envoient pas de SNI.
      TLS_DEFAULT_SNI: ${TLS_DEFAULT_SNI:-${SERVER_ADDRESS}}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [internal]

volumes:
  pgdata:
  documents:
  caddy_data:
  caddy_config:

networks:
  internal:
